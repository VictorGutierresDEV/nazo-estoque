<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Geist, system-ui, -apple-system, sans-serif; }
    a { color: #b4432c; text-decoration: none; }
    a:hover { color: #8f351f; }
    .tecla { min-height: 56px; border: 1px solid #e7e2db; border-radius: 10px; background: #ffffff;
             font-family: inherit; font-size: 24px; font-weight: 600; color: #1c1917; cursor: pointer; }
    .tecla:active { background: #f3efe9; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #faf8f5; color: #1c1917; display: flex; flex-direction: column; overflow: hidden">

  <!-- cabeçalho com progresso -->
  <div style="padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e7e2db">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px">
      <button style="width: 36px; height: 36px; border: 1px solid #e7e2db; border-radius: 8px; background: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5l-6 5.5 6 5.5"/></svg>
      </button>
      <div style="text-align: center; min-width: 0">
        <div style="font-size: 15px; font-weight: 700">Pulmão do Sushi</div>
        <div style="font-size: 12px; color: #78716c">contagem de 24/ago</div>
      </div>
      <div style="font-size: 13px; font-weight: 600; color: #78716c; flex-shrink: 0; font-variant-numeric: tabular-nums">12/34</div>
    </div>
    <div style="height: 5px; border-radius: 3px; background: #eeeae4; overflow: hidden">
      <div style="width: 35%; height: 100%; background: #b4432c; border-radius: 3px"></div>
    </div>
  </div>

  <!-- o item -->
  <div style="padding: 26px 20px 14px; text-align: center">
    <div style="font-size: 26px; font-weight: 700; line-height: 1.2; letter-spacing: -0.015em; margin-bottom: 10px; text-wrap: pretty">Camarão s/ casca 51/60</div>
    <div style="display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: #b4432c; background: #fdf0ec; padding: 7px 12px; border-radius: 8px; font-weight: 500">
      <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="3" y="6" width="14" height="10" rx="1.5"/><path d="M3 9.5h14M8 6V4.5h4V6"/></svg>
      conte em caixas de 2&nbsp;kg
    </div>
  </div>

  <!-- valor -->
  <div style="padding: 6px 20px 0; text-align: center">
    <div style="font-size: 68px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">7<span style="color: #a8a29e">,</span>5</div>
    <div style="font-size: 15px; color: #78716c; margin-top: 6px">caixas</div>
  </div>

  <div style="flex: 1"></div>

  <!-- teclado -->
  <div style="padding: 0 16px 8px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button class="tecla">1</button>
      <button class="tecla">2</button>
      <button class="tecla">3</button>
      <button class="tecla">4</button>
      <button class="tecla">5</button>
      <button class="tecla">6</button>
      <button class="tecla">7</button>
      <button class="tecla">8</button>
      <button class="tecla">9</button>
      <button class="tecla" style="font-size: 26px">,</button>
      <button class="tecla">0</button>
      <button class="tecla" style="display: inline-flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H9l-5 6 5 6h11a1 1 0 001-1V7a1 1 0 00-1-1z"/><path d="M17 10l-4 4M13 10l4 4"/></svg>
      </button>
    </div>
  </div>

  <!-- ações -->
  <div style="padding: 6px 16px 20px; display: flex; gap: 8px">
    <button style="flex: 0 0 96px; min-height: 54px; border: 1px solid #e7e2db; border-radius: 10px; background: #ffffff; color: #78716c; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">Zero</button>
    <button style="flex: 1; min-height: 54px; border: 0; border-radius: 10px; background: #b4432c; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
      Próximo
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h11M11 6l4 4-4 4"/></svg>
    </button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
