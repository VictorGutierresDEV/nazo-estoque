<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Geist, system-ui, -apple-system, sans-serif; }
    a { color: #b4432c; text-decoration: none; }
    a:hover { color: #8f351f; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #faf8f5; color: #1c1917; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e7e2db; display: flex; align-items: center; gap: 12px">
    <button style="width: 36px; height: 36px; border: 1px solid #e7e2db; border-radius: 8px; background: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5l-6 5.5 6 5.5"/></svg>
    </button>
    <div style="min-width: 0">
      <div style="font-size: 15px; font-weight: 700">Apurar divergência</div>
      <div style="font-size: 12px; color: #78716c">1 de 1 pendente</div>
    </div>
  </div>

  <!-- o fato -->
  <div style="padding: 16px; background: #ffffff; border-bottom: 1px solid #e7e2db">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 14px">
      <div style="min-width: 0">
        <span style="display: inline-block; font-size: 11px; font-weight: 700; color: #b45309; background: rgba(180,83,9,0.10); padding: 4px 8px; border-radius: 6px; letter-spacing: 0.02em; margin-bottom: 8px">RESÍDUO EM TRÂNSITO · 2 DIAS</span>
        <div style="font-size: 19px; font-weight: 700; line-height: 1.25; text-wrap: pretty">Camarão s/ casca 51/60</div>
        <div style="font-size: 14px; color: #78716c; margin-top: 4px">Sushi · separado 15, recebido 12</div>
      </div>
      <div style="text-align: right; flex-shrink: 0">
        <div style="font-size: 34px; font-weight: 700; color: #b45309; line-height: 1; font-variant-numeric: tabular-nums">3</div>
        <div style="font-size: 13px; color: #78716c; margin-top: 2px">kg</div>
      </div>
    </div>
  </div>

  <!-- a pergunta -->
  <div style="padding: 16px 16px 10px">
    <div style="font-size: 17px; font-weight: 600">O que aconteceu com os 3&nbsp;kg?</div>
    <div style="font-size: 13px; color: #78716c; margin-top: 3px">A causa decide para onde o saldo vai</div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 8px">

    <!-- causa selecionada -->
    <button style="text-align: left; background: #ffffff; border: 2px solid #b4432c; border-radius: 12px; padding: 13px 14px; cursor: pointer; font-family: inherit; box-shadow: 0 2px 8px rgba(180,67,44,0.10)">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 7px">
        <div style="width: 20px; height: 20px; border-radius: 50%; background: #b4432c; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5l3.5 3.5 7.5-7.5"/></svg>
        </div>
        <span style="font-size: 15px; font-weight: 600; color: #1c1917">Separei menos do que registrei</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; padding-left: 30px">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M4 10h11M11 6l4 4-4 4"/></svg>
        <span style="font-size: 13px; color: #15803d; font-weight: 500">volta ao Estoque Principal</span>
      </div>
      <div style="font-size: 12px; color: #78716c; padding-left: 30px; margin-top: 5px; line-height: 1.4">A mercadoria nunca saiu da sala, então isto corrige o registro</div>
    </button>

    <button style="text-align: left; background: #ffffff; border: 1px solid #e7e2db; border-radius: 12px; padding: 13px 14px; cursor: pointer; font-family: inherit">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 7px">
        <div style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #d9d2c9; flex-shrink: 0"></div>
        <span style="font-size: 15px; font-weight: 600">Ficou na porta e foi recolhido depois</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; padding-left: 30px">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="#78716c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M4 10h11M11 6l4 4-4 4"/></svg>
        <span style="font-size: 13px; color: #78716c; font-weight: 500">entra no pulmão do Sushi</span>
      </div>
    </button>

    <button style="text-align: left; background: #ffffff; border: 1px solid #e7e2db; border-radius: 12px; padding: 13px 14px; cursor: pointer; font-family: inherit">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 7px">
        <div style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #d9d2c9; flex-shrink: 0"></div>
        <span style="font-size: 15px; font-weight: 600">Erro na conferência do recebimento</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; padding-left: 30px">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="#78716c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M4 10h11M11 6l4 4-4 4"/></svg>
        <span style="font-size: 13px; color: #78716c; font-weight: 500">entra no pulmão do Sushi</span>
      </div>
    </button>

    <button style="text-align: left; background: #ffffff; border: 1px solid #e7e2db; border-radius: 12px; padding: 13px 14px; cursor: pointer; font-family: inherit">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 7px">
        <div style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #d9d2c9; flex-shrink: 0"></div>
        <span style="font-size: 15px; font-weight: 600">Perda entre a porta e o pulmão</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; padding-left: 30px">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="#b4432c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M4.5 5.5l11 9M15.5 5.5l-11 9"/></svg>
        <span style="font-size: 13px; color: #b4432c; font-weight: 500">sai do sistema como perda</span>
      </div>
    </button>

    <!-- motivo obrigatório da causa escolhida -->
    <div style="margin-top: 2px">
      <label style="display: block; font-size: 13px; font-weight: 500; color: #78716c; margin-bottom: 6px">Motivo <span style="color: #b4432c">obrigatório</span></label>
      <div style="min-height: 48px; border: 1px solid #e7e2db; border-radius: 8px; background: #ffffff; padding: 13px 12px; font-size: 15px; color: #1c1917">Conferi com o Jonas: só 12 kg saíram</div>
    </div>

  </div>

  <div style="padding: 12px 16px 20px">
    <button style="width: 100%; min-height: 56px; border: 0; border-radius: 10px; background: #b4432c; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Apurar e devolver 3&nbsp;kg</button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
